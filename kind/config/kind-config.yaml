kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tasks-cluster
nodes:
  - role: control-plane
    # extraPortMappings говорит Docker'у пробросить порты 80 и 443 с
    # вашего Mac внутрь узла кластера.
    extraPortMappings:
    - containerPort: 80
      hostPort: 80
    - containerPort: 443
      hostPort: 443