spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: tasks-route
              uri: http://localhost:8091
              predicates:
                - Path=/tasks/**
#    loadbalancer:
#      cache:
#        enabled: true
#        ttl: 5s # 35s
##      health-check:
##       initial-delay: 0


#  позволит смотреть на http://<gateway>/actuator/gateway/routes — очень помогает при отладке маршрутов.
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
