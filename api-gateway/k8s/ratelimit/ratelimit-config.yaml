apiVersion: v1
kind: ConfigMap
metadata:
  name: ratelimit-config
  namespace: default
data:
  config.yaml: |
    domain: tasks-app
    descriptors:
      # Правило 1: не более 5 запросов в минуту с одного IP на все урлы, иначе 429)
      - key: remote_address
        value: "*" #-> это wildcard, который соответствует любому IP 
        rate_limit:
          unit: minute
          requests_per_unit: 1000000 # Для нагрузочного теста - 1000000
      # Правило 2: общий лимит 100 запросов в минуту на весь сервис
      - key: generic_key
        value: global
        rate_limit:
          unit: minute
          requests_per_unit: 1000000 # Для нагрузочного теста - 1000000


# Для перезагрузки конфига
# kubectl apply -f ratelimit-config.yaml
# kubectl rollout restart deploy/ratelimit
# kubectl rollout status deploy/ratelimit