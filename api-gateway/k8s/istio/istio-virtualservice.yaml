apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: sc-gateway-vs # 👈 Одно общее имя для входной маршрутизации
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - tasks-app-gateway # 🔗 Подключаемся к вашему единственному неизменному istio-gateway.yaml(metadata.name)
  http:
    - route:
        - destination:
            # 🚀 Перенаправляем весь этот поток на ваш новый Spring Cloud Gateway!
            host: sc-gateway # sc-gateway.default.svc.cluster.local
            port:
              number: 80 # Порт, который мы указали в манифесте gateway-deployment.yaml
