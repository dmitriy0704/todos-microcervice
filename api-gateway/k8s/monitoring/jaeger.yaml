apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: istio-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: 16686
            - name: zipkin
              containerPort: 9411
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: tracing
  namespace: istio-system
spec:
  selector:
    app: jaeger
  ports:
    - name: http-query
      port: 80
      targetPort: 16686
    - name: grpc-otel
      port: 4317
      targetPort: 4317
    - name: http-otel
      port: 4318
      targetPort: 4318
    - name: http-zipkin
      port: 9411
      targetPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: istio-system
spec:
  selector:
    app: jaeger
  ports:
    - name: http
      port: 9411
      targetPort: 9411
