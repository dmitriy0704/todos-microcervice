apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: default
spec:
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        # Отключаем Istio сайдкар, чтобы он не перехватывал бинарный TCP-трафик Кафки
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:latest
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            # Генерируем случайный уникальный ID кластера для KRaft-режима
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

            # ⚠️ ДЛЯ ТЕСТОВОГО ЗАПУСКА В MINIKUBE ДОБАВЛЯЕМ ЭТИ ТРИ СТРОКИ ДЛЯ ОДНОЙ НОДЫ:
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            # Для надежности:
            # Количество синхронных копий топика, необходимых для подтверждения записи
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"  # (На проде: "3")
            - name: KAFKA_OFFSETS_TOPIC_MIN_ISR
              value: "1" # (На проде: "2" — запись успешна, только если подтвердили 2 ноды из 3)
              # Автоматическое создание топиков (лучше выключить, чтобы контролировать структуру)
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
