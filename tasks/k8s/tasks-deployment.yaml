apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks
spec:
  replicas: 1 # Количество запущенных экземпляров вашего приложения
  selector:
    matchLabels:
      app: tasks
  template:
    metadata:
      labels:
        app: tasks
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      initContainers: # Так под tasks-service запускается только после config-server
        - name: wait-for-config
          image: busybox
          command:
            - sh
            - -c
            - |
              until wget -qO- http://config-server:8888/actuator/health; do
                echo "waiting for config-server..."
                sleep 2
              done
      containers:
        - name: tasks # ⚠️ Локальный образ, который мы соберем внутри окружения Minikube
          image: myorg/tasks:1.0
          imagePullPolicy: Never # Говорим K8s не искать образ в Docker Hub
          ports:
            - containerPort: 8091
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SERVER_PORT
              value: "8091"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: # данные берутся из секрета(tasks-postgres-secret.yaml)
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
#            - name: SPRING_DATASOURCE_URL
#              value: "jdbc:postgresql://postgres:5432/tasksdb"
---
apiVersion: v1
kind: Service
metadata:
  name: tasks
spec:
  selector:
    app: tasks # Должен совпадать с deploy.template.metadata.labels
  ports:
    - name: http
      port: 80
      targetPort: 8091
      # nodePort: 30091 # Приложение будет доступно по этому порту на IP-адресе Minikube, только для NodePort
      protocol: TCP
  type: ClusterIP # Если NodePort, то - Позволяет открыть порт приложения наружу для вашего ПК

