apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tasks-mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-mongodb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks-mongodb
  template:
    metadata:
      labels:
        app: tasks-mongodb
      annotations:
        sidecar.istio.io/inject: "false" # 👈 Эта строка запретит Istio трогать базу
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: rootadmin
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: supersecretpassword
            - name: MONGO_INITDB_DATABASE
              value: tasksdb
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: tasks-mongo-pvc # 👈 Ссылка на правильный диск
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-mongodb-service # ⚠️ Важно: имя сервиса станет DNS-именем для Spring Boot
spec:
  ports:
    - port: 27017
  selector:
    app: tasks-mongodb # 👈 Ищет именно поды базы задач