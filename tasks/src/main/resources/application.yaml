resilience4j:
  circuitbreaker:
    instances:
      mongoDb:
        registerHealthIndicator: true
        slidingWindowSize: 10 # Сколько последних вызовов учитывать. 100 для прода
        minimumNumberOfCalls: 5 # Минимум вызовов до расчёта процента ошибок. 20 для прода
        failureRateThreshold: 50 # Порог ошибок (%), после которого цепь размыкается. % ошибок для размыкания. для прода 30
        waitDurationInOpenState: 10s # Сколько ждать перед попыткой закрыть цепь. сколько сидеть в OPEN. для прода 30.
        permittedNumberOfCallsInHalfOpenState: 3 # Сколько тестовых вызовов разрешить в полуоткрытом состоянии: все 3 успешны - CLOSED, хоть один failed - OPEN (снова), для прода 5
        automaticTransitionFromOpenToHalfOpenEnabled: true # авто-переход
        slowCallRateThreshold: 50           # если 50% вызовов медленные
        slowCallDurationThreshold: 2s       # что считать "медленным"

        # Считать ошибкой только некоторые исключения
        recordExceptions:
#          - java.lang.Exception
          - com.mongodb.MongoException
          - org.springframework.dao.DataAccessException
          - java.net.ConnectException
          - java.net.SocketTimeoutException

  retry:
    instances:
      mongoDb:
        maxAttempts: 2 # Сколько раз повторять при ошибке (3)
        waitDuration: 100ms # Пауза между попытками (500)
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.mongodb.MongoSocketOpenException
          - java.net.ConnectException
  timelimiter:
    instances:
      mongoDb:
        timeoutDuration: 3s
        cancelRunningFuture: true