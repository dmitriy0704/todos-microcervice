spring:
  application:
    name: tasks-service
  threads: # Включает виртуальные потоки
    virtual:
      enabled: true
  config:
    import: configserver:http://config-server:8888  #<- в таком виде tasks-service ждет запуска config-server, а так было  optional:configserver:http://config-server:8888

  # ${MONGO_URI:...} — «возьми переменную окружения MONGO_URI,
  # а если её нет — используй значение после двоеточия».
  #  mongodb: #- перенесено в config-repo/tasks-service.yaml
  #    uri: ${MONGO_URI:mongodb://localhost:27017/tasksdb}
  kafka:
    # Общие настройки подключения брокера
    bootstrap-servers: ${KAFKA_SERVERS:kafka-service:9092} # Указываем адрес K8s-сервиса Кафки и её порт
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      # КОНФИГИ ДЛЯ НАДЕЖНОСТИ:
      # 1. Подтверждение записи (all или -1)
      # Брокер ответит Java-приложению только тогда, когда ВСЕ реплики запишут сообщение на диск.
      # Это гарантирует нулевую потерю данных (Zero Data Loss).
      acks: all

      # 2. Повторные попытки при сетевых сбоях
      # Если сеть моргнет, Spring будет автоматически пытаться отправить сообщение снова
      retries: 5

      # 3. Защита от дубликатов (Идемпотентность)
      # Если сообщение долетело до Кафки, но ответ сети потерялся, продюсер отправит его снова.
      # Этот флаг гарантирует, что Кафка отфильтрует дубликат и сохранит сообщение строго ОДИН раз.
      properties:
        enable.idempotence: true

        max.in.flight.requests.per.connection: 5 # Оптимальное число для идемпотентности

        # Настройки для оптимизации пакетной отправки (опционально)
        # В Apache Kafka 4.0+ значение linger.ms по умолчанию изменено с 0 на 5 мс для лучшей пропускной способности
        linger.ms: 5
        batch.size: 16384

server:
  port: 8091

# Для настройки актуатора:
management:
  endpoints: # Открыть эндпоинты (health, info, metrics, env и др.)
    web:
      exposure:
        include: health,info,metrics,env,configprops,circuitbreakers,circuitbreakerevents,retries,ratelimiters,bulkheads
  endpoint:
    env:
      show-values: always
    health:
      show-details: always # Показывать подробную информацию о состоянии здоровья (всегда, а не только при ошибке)
      probes:
        enabled: true # Пробы Liveness и Readiness (в Spring Boot 4 включены по умолчанию, но можно управлять явно)
  # Пример выделения Actuator на отдельный порт для безопасности (опционально)
  # management.server.port=9001

