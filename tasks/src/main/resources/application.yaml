spring:
  application:
    name: tasks-service
  threads: # Включает виртуальные потоки, но выключает параметры управления потоками Tomcat
    virtual:
      enabled: false # Выключим, пока тестируем нагрузки на Tomcat
  config:
    import: configserver:http://config-server:8888  #<- в таком виде tasks-service ждет запуска config-server, а так было  optional:configserver:http://config-server:8888

  # ${MONGO_URI:...} — «возьми переменную окружения MONGO_URI,
  # а если её нет — используй значение после двоеточия».
  #  mongodb: #- перенесено в config-repo/tasks-service.yaml
  #    uri: ${MONGO_URI:mongodb://localhost:27017/tasksdb}
  kafka:
    # Общие настройки подключения брокера
    bootstrap-servers: ${KAFKA_SERVERS:kafka-service:9092} # Указываем адрес K8s-сервиса Кафки и её порт
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      # КОНФИГИ ДЛЯ НАДЕЖНОСТИ:
      # 1. Подтверждение записи (all или -1)
      # Брокер ответит Java-приложению только тогда, когда ВСЕ реплики запишут сообщение на диск.
      # Это гарантирует нулевую потерю данных (Zero Data Loss).
      acks: all

      # 2. Повторные попытки при сетевых сбоях
      # Если сеть моргнет, Spring будет автоматически пытаться отправить сообщение снова
      retries: 5

      # 3. Защита от дубликатов (Идемпотентность)
      # Если сообщение долетело до Кафки, но ответ сети потерялся, продюсер отправит его снова.
      # Этот флаг гарантирует, что Кафка отфильтрует дубликат и сохранит сообщение строго ОДИН раз.
      properties:
        enable.idempotence: true

        max.in.flight.requests.per.connection: 5 # Оптимальное число для идемпотентности

        # Настройки для оптимизации пакетной отправки (опционально)
        # В Apache Kafka 4.0+ значение linger.ms по умолчанию изменено с 0 на 5 мс для лучшей пропускной способности
        linger.ms: 5
        batch.size: 16384


# НАСТРОЙКИ СЕРВЕРА TOMCAT:
# (настройка коннектов БД вынесена вместе с общими настройками
# подключения в config-repo/tasks-service.md)
server:
  port: 8091
  # параметры управления потоками Tomcat выключаются при включении виртуальных потоков
  tomcat:
    mbeanregistry:
      enabled: true  # ← включает Tomcat MBeans → метрики потоков
    threads:
      # - это потолок вашей одновременной обработки. Приложение может
      # одновременно выполнять ровно 400 запросов. Если придет 401-й запрос,
      # Tomcat не будет создавать для него поток.
      max: 400
      # - это «горячий старт». При запуске приложения Tomcat сразу создает
      # 20 потоков и держит их наготове, чтобы первые пользователи не ждали,
      # пока поток создастся в ОС.
      min-spare: 20
      # - это длина очереди на уровне операционной системы (TCP backlog).
    accept-count: 200
    #-> Пояснение:
    # • Если у вас заняты все max: 400 потоков, новые запросы не отбрасываются
    # сразу. Они встают в очередь внутри ОС.
    # • Ваша очередь может вместить ровно 200 запросов.
    # • Если в очереди уже лежит 200 запросов, а потоки всё еще заняты, то
    # 601-й запрос упадет сразу с ошибкой Connection refused (в k6 это выглядит
    # как dial tcp: connect: connection refused).



# НАСТРОЙКИ МЕТРИК АКТУАТОРА
management:
  endpoints: # Открыть эндпоинты (health, info, metrics, env и др.)
    web:
      exposure:
        include: health,info,metrics,threaddump,prometheus,env,configprops,circuitbreakers,circuitbreakerevents,retries,ratelimiters,bulkheads
  metrics:
    tags:
      application: ${spring.application.name}   # метка для фильтрации в Grafana
    distribution:
      percentiles-histogram:
        http.server.requests: true # Включить публикацию гистограмм для HTTP-запросов
  prometheus:
    metrics:
      export:
        enabled: true
        histogram-flavor: server # Использовать нативный формат Prometheus (с бакетами)
  endpoint:
    env:
      show-values: always
    health:
      show-details: always # Показывать подробную информацию о состоянии здоровья (всегда, а не только при ошибке)
      probes:
        enabled: true # Пробы Liveness и Readiness (в Spring Boot 4 включены по умолчанию, но можно управлять явно)
  # Пример выделения Actuator на отдельный порт для безопасности (опционально)
  # management.server.port=9001

# ЛОГИРОВАНИЕ:
#  level:
#    org.springframework.cloud.config: DEBUG
#    org.springframework.boot.context.config: DEBUG


# ОТКАЗОУСТОЙЧИВОСТЬ:
resilience4j:
  # Автоматический выключатель
  circuitbreaker: #-> Соответствует @CircuitBreaker(name = "postgres", fallbackMethod = "fallbackCreateTask")
    instances:
      postgres:
        registerHealthIndicator: true
        slidingWindowSize: 10 # Сколько последних вызовов учитывать. 100 для прода
        minimumNumberOfCalls: 5 # Минимум вызовов до расчёта процента ошибок. 20 для прода
        failureRateThreshold: 50 # Порог ошибок (%), после которого цепь размыкается. % ошибок для размыкания. Для прода - 30
        waitDurationInOpenState: 10s # Сколько ждать перед попыткой закрыть цепь. Сколько сидеть в OPEN. Для прода - 30.
        permittedNumberOfCallsInHalfOpenState: 3 # Сколько тестовых вызовов разрешить в полуоткрытом состоянии: все 3 успешны - CLOSED, хоть один failed - OPEN (снова), для прода 5
        automaticTransitionFromOpenToHalfOpenEnabled: true # авто-переход
        slowCallRateThreshold: 50           # если 50% вызовов медленные
        slowCallDurationThreshold: 2s       # что считать "медленным"

        # ⚠️ ВАЖНО: BulkheadFullException — не ошибка MongoDB,
        # поэтому НЕ должен размыкать circuit breaker
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException

        # Считать ошибкой только некоторые исключения
        recordExceptions:
          # - java.lang.Exception -> можно оставить для отладки, но не для прода
          - org.springframework.dao.DataAccessResourceFailureException # Не удалось подключиться к БД
          - org.springframework.dao.QueryTimeoutException # Запрос превысил таймаут
          - org.springframework.dao.TransientDataAccessResourceException # Временная ошибка (retry имеет смысл)
          - org.springframework.dao.CannotAcquireLockException # Не удалось взять блокировку
          - org.springframework.jdbc.CannotGetJdbcConnectionException # Не удалось получить соединение из пула (HikariCP)
          - java.sql.SQLException # Общая ошибка SQL (fallback)
          - java.net.ConnectException # Сетевые ошибки
          - java.net.SocketTimeoutException # Сетевые ошибки
  retry: #-> Соответствует @Retry(name = "postgres") //-> перехватывает вызов и повторяет его до 3 раз при ошибке; //    @Retry(name = "postgres") - опасно для POST - возможны дубликаты
    instances:
      postgres:
        maxAttempts: 2 # Сколько раз повторять при ошибке (3 для прода)
        waitDuration: 100ms # Пауза между попытками (500 для прода)
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.dao.TransientDataAccessResourceException
          - java.net.ConnectException
  timelimiter: #-> Соответствует @TimeLimiter(name = "postgres") //-> прерывает вызов, если он длится дольше 3 секунд. Для асинхронных методов
    instances:
      postgres:
        timeoutDuration: 3s
        cancelRunningFuture: true

  # Перегородка
  bulkhead: #-> Соответствует @Bulkhead(name = "postgres", type = Bulkhead.Type.SEMAPHORE, fallbackMethod = "fallbackCreateTask")
    instances:
      postgres:
        maxConcurrentCalls: 10 #-> Количество одновременных вызовов метода, над которым стоит @Bulkhead
        maxWaitDuration: 0 #-> 0 - НЕ ждать, сразу fallback; 100ms - Дополнительные запросы будут ожидать до 100ms или будут отклонены
        # С maxWaitDuration: 0 запросы, не получившие слот мгновенно, получают BulkheadFullException → fallback → быстрый 503. Это лучше, чем 60-секундный таймаут.

