apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
spec:
  replicas: 1 # Количество запущенных экземпляров вашего приложения
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          # ⚠️ Локальный образ, который мы соберем внутри окружения Minikube
          image: myorg/users-service:1.0
          imagePullPolicy: Never # Говорим K8s не искать образ в Docker Hub
          ports:
            - containerPort: 8092
          env:
            - name: SERVER_PORT
              value: "8092" # Порт приложения
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: # данные берутся из секрета(tasks-postgres-secret.yaml)
                  name: users-postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-postgres-credentials
                  key: POSTGRES_PASSWORD
#            - name: SPRING_DATASOURCE_URL
#              value: "jdbc:postgresql://postgres:5432/usersdb"

            # Kafka
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.default.svc.cluster.local:9092"
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "users-service-group"
            - name: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
              value: "earliest"
            - name: SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED
              value: "true"        # ← для tracing через Kafka
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users-service # Должен совпадать с deploy.template.metadata.labels
  ports:
    - name: http
      port: 80 # 👈 Сюда будет стучаться RestTemplate = порт внутри сети
      targetPort: 8092
      # nodePort: 30091 # Приложение будет доступно по этому порту на IP-адресе Minikube, только для NodePort
      protocol: TCP
  type: ClusterIP # Если NodePort, то - Позволяет открыть порт приложения наружу для вашего ПК

